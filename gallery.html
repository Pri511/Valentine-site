<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>📸 Our Memories</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-glow">
<main class="center-wrap">
  <section class="card wide">

    <h1 class="title">Okay… now the cute part ❤️</h1>
    <p class="subtitle">Suprise!!✨</p>

    <!-- VIDEO CONTAINER -->
    <div class="reel-wrap">
      <!-- IMPORTANT: update filename to your actual video file under assets -->
      <video id="reelVideo" class="reel-video" playsinline loop preload="auto">
        <source src="assets/memes/movie1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <!-- MUSIC (if your video already has audio, you can REMOVE this whole block) -->
    <div class="audio-box" style="justify-content:center;">
      <button class="btn btn-play" id="playBtn" type="button">▶ Play</button>
      <span class="tiny-hint" id="mediaStatus"></span>

      <!-- If you want separate background music along with the video -->
      <audio id="bgMusic" loop preload="auto">
        <source src="assets/music/music.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="footer-row">
      <a class="btn btn-home" href="index.html">Back to Beginning ❤️</a>
    </div>

  </section>
</main>

<script src="script.js"></script>
</body>
</html>


<script src="script.js"></script>
</body>
</html>
