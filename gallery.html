<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>📸 Our Memories</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-glow">
<main class="center-wrap">
  <section class="card wide">

    <h1 class="title">Okay… now the cute part ❤️</h1>
    <p class="subtitle">Our memories together ✨</p>

    <!-- MUSIC PLAYER -->
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-play" id="playBtn" type="button">▶ Play Music</button>
      <span class="tiny-hint" id="audioStatus"></span>

      <audio id="bgMusic" loop preload="auto">
        <source src="assets/music/music.mp3" type="audio/mpeg">
      </audio>
    </div>

    <!-- SLIDESHOW (no scrolling) -->
    <div class="slideshow" id="slideshow">
      <!-- IMPORTANT: these filenames must match EXACTLY what is in assets/photos/ -->
      <img class="slide active" src="assets/photos/image1_.JPG" alt="Memory 1">
      <img class="slide" src="assets/photos/image2_.jpg" alt="Memory 2">
      <img class="slide" src="assets/photos/image3.jpg" alt="Memory 3">
      <img class="slide" src="assets/photos/image4_.jpg" alt="Memory 4">
      <img class="slide" src="assets/photos/image5_.png" alt="Memory 5">
      <img class="slide" src="assets/photos/image6_.JPG" alt="Memory 6">
      <img class="slide" src="assets/photos/image7_.JPG" alt="Memory 7">
    </div>

    <!-- Dots under slideshow -->
    <div class="slide-dots" id="dots"></div>

    <div class="footer-row">
      <a class="btn btn-home" href="index.html">Back to Beginning ❤️</a>
    </div>

  </section>
</main>

<script src="script.js"></script>
</body>
</html>
